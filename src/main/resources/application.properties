spring.application.name=Noto-back

# Connexion PostgreSQL
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/notoDB}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:2a7JFfXGaz07cmczJcV0B9T5XIaW8JMRzhlw2BK436K}
jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
# 15 minutes en ms
jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}
# 7 jours en ms

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
server.port=${PORT:8080}


# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


